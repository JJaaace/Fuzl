<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="fuzl-mascot is-lighting" style="color:#f5f0e7"><title>Light the fuse</title><style>/* Light the fuse: one 800ms ignition; only dots repeat during a real request. */
.fuzl-mascot { display: block; width: 100%; height: 100%; overflow: visible; }
.fuse-dot-far { fill: var(--spark-amber, #ffbe69); }
.fuse-dot-middle, .fuse-dot-near { fill: currentColor; }
.is-monochrome .fuse-dot { fill: currentColor; }
.mascot-body { transform-box: fill-box; transform-origin: 50% 70%; }
.mascot-smile { transform-box: fill-box; transform-origin: 50% 30%; }
.fuzl-mascot.is-lighting .fuse-dot-far, .fuse-waiting .fuse-dot-far { animation: fuse-far 800ms ease-in-out; }
.fuzl-mascot.is-lighting .fuse-dot-middle, .fuse-waiting .fuse-dot-middle { animation: fuse-middle 800ms ease-in-out; }
.fuzl-mascot.is-lighting .fuse-dot-near, .fuse-waiting .fuse-dot-near { animation: fuse-near 800ms ease-in-out; }
.fuzl-mascot.is-lighting .mascot-body { animation: fuse-lift 800ms cubic-bezier(.35, 0, .2, 1); }
.fuzl-mascot.is-lighting .mascot-smile { animation: fuse-smile 800ms cubic-bezier(.35, 0, .2, 1); }
.fuse-waiting .fuse-dot { animation-iteration-count: infinite; }
.fuse-indicator { color: var(--ink, #f5f0e7); flex-shrink: 0; }
/* Crossfaded color/brightness, without popping individual dots in size. */
@keyframes fuse-far { 0%, 10%, 100% { fill: var(--spark-amber, #ffbe69); opacity: 1; } 32%, 74% { fill: currentColor; opacity: .65; } }
@keyframes fuse-middle { 0%, 12%, 64%, 100% { fill: currentColor; opacity: 1; } 32%, 40% { fill: var(--spark-amber, #ffbe69); opacity: 1; } }
@keyframes fuse-near { 0%, 36%, 90%, 100% { fill: currentColor; opacity: 1; } 56%, 65% { fill: var(--spark-amber, #ffbe69); opacity: 1; } }
@keyframes fuse-lift { 0%, 48%, 100% { transform: translateY(0); } 70% { transform: translateY(-1.35px); } }
@keyframes fuse-smile { 0%, 48%, 100% { transform: scale(1); } 70% { transform: scale(1.035, 1.075); } }
@media (prefers-reduced-motion: reduce) { .fuzl-mascot *, .fuse-waiting * { animation: none !important; transform: none !important; } }
</style><g class="mascot-body" fill="currentColor"><path d="M25 18Q27 19 29 23" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><rect x="25" y="15" width="14" height="11" rx="3" transform="rotate(-36 32 20.5)"/><circle cx="39" cy="41" r="21"/><path class="mascot-smile" d="M25 37C25 55 53 55 53 37" fill="none" stroke="#24170b" stroke-width="6.4" stroke-linecap="round"/></g><circle class="fuse-dot fuse-dot-far" cx="4" cy="5" r="2" fill="#ffbe69"/><circle class="fuse-dot fuse-dot-middle" cx="12" cy="8" r="2.6" fill="currentColor"/><circle class="fuse-dot fuse-dot-near" cx="20" cy="13" r="3.2" fill="currentColor"/></svg>